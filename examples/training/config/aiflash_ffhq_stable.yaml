# Stable SD1.5/FFHQ diagnostic configuration.
wandb_project: lbm-aiflash

train_shards:
  - /home/datas/nas-hz1/LBM/dataset/aiflash_ffhq_padding_0512x0512.tar
validation_shards:
  - /home/datas/nas-hz1/LBM/dataset/aiflash_ffhq_padding_0512x0512_10.tar

vae_backbone_signature: stable-diffusion-v1-5/stable-diffusion-v1-5
unet_backbone_signature: stable-diffusion-v1-5/stable-diffusion-v1-5
# Must contain a scheduler compatible with FlowMatchEulerDiscreteScheduler.
scheduler_backbone_signature: stabilityai/stable-diffusion-xl-base-1.0
# Generate this file with the SD1.5 text encoder using exactly: flash lighting.
prompt_embedding_path: /home/arc-wgq2719/work/lbm/prompt_cache/flash_lighting.pt

# Dataset keys intentionally remain the original image/normal/mask contract.
source_key: image
target_key: normal
mask_key: mask

batch_size: 2
learning_rate: 1.0e-5
optimizer: AdamW
optimizer_kwargs:
  weight_decay: 0.01

# First establish a stable latent-only baseline.
latent_loss_type: l2
latent_loss_weight: 1.0
pixel_loss_type: lpips
pixel_loss_weight: 0.0
bridge_noise_sigma: 0.0

timestep_sampling: custom_timesteps
selected_timesteps: [250, 500, 750, 1000]
prob: [0.25, 0.25, 0.25, 0.25]

num_steps: [1, 4]
log_interval: 500
resume_from_checkpoint: false
max_epochs: 50
save_interval: 5000
val_check_interval: 5000
save_ckpt_path: ./checkpoints/checkpoints-aiflash-ffhq-padding-0512x0512-stable
