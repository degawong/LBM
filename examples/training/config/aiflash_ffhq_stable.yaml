    import sys

    DEFAULT_CFG = "/media/83nvme/wgq2719/MyCode/LBM/examples/training/config/aiflash.yaml"
    if len(sys.argv) > 1:
        fire.Fire(main_from_config)
    else:
        main_from_config(DEFAULT_CFG)
